<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="barGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>
    <linearGradient id="barGrad3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Canvas -->
  <rect x="32" y="32" width="448" height="448" rx="88" fill="url(#bgGrad)" />

  <!-- Inner Dark Card Frame -->
  <rect x="56" y="56" width="400" height="400" rx="68" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="3" />

  <!-- Header Bar -->
  <rect x="96" y="104" width="140" height="20" rx="10" fill="url(#accentGrad)" />
  <circle cx="380" cy="114" r="8" fill="#38bdf8" />
  <circle cx="404" cy="114" r="8" fill="#f43f5e" />

  <!-- Metric Headline / Typography Representation -->
  <rect x="96" y="148" width="220" height="32" rx="8" fill="#ffffff" />
  <rect x="96" y="192" width="160" height="14" rx="7" fill="#94a3b8" />

  <!-- Layout Cards / Graphic Elements -->
  <rect x="96" y="230" width="148" height="170" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="2" />
  <!-- Bar chart inside card -->
  <rect x="120" y="330" width="24" height="50" rx="6" fill="url(#barGrad1)" />
  <rect x="156" y="280" width="24" height="100" rx="6" fill="url(#barGrad2)" />
  <rect x="192" y="310" width="24" height="70" rx="6" fill="url(#barGrad3)" />

  <!-- Right Visual / Image Collage Representation -->
  <rect x="268" y="230" width="148" height="170" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="2" />
  <circle cx="342" cy="290" r="34" fill="url(#accentGrad)" opacity="0.8" filter="url(#glow)" />
  <path d="M288 380 L322 334 L350 364 L374 338 L396 380 Z" fill="rgba(255,255,255,0.25)" />

  <!-- Magic Sparkle Badge -->
  <g transform="translate(370, 70)">
    <path d="M24 0 L29 16 L45 21 L29 26 L24 42 L19 26 L3 21 L19 16 Z" fill="#facc15" filter="url(#glow)" />
  </g>
</svg>
